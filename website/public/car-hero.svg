<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061018"/>
      <stop offset="45%" stop-color="#0a2a4a"/>
      <stop offset="100%" stop-color="#123a5c"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2430"/>
      <stop offset="100%" stop-color="#0b121a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b9fff"/>
      <stop offset="100%" stop-color="#1e6bff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb020"/>
      <stop offset="100%" stop-color="#ff8a00"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#sky)"/>
  <ellipse cx="1100" cy="180" rx="260" ry="120" fill="#5b9fff" opacity="0.12" filter="url(#soft)"/>
  <ellipse cx="320" cy="220" rx="200" ry="100" fill="#ffb020" opacity="0.08" filter="url(#soft)"/>
  <!-- track -->
  <path d="M0 540 C360 480 720 620 1440 500 L1440 900 L0 900 Z" fill="url(#road)"/>
  <path d="M0 620 C400 560 800 700 1440 580" stroke="#ffb020" stroke-width="4" stroke-dasharray="28 22" opacity="0.55"/>
  <!-- car shadow -->
  <ellipse cx="720" cy="640" rx="210" ry="28" fill="#000" opacity="0.35"/>
  <!-- chassis -->
  <g transform="translate(520 470)">
    <rect x="20" y="70" width="360" height="90" rx="28" fill="url(#body)"/>
    <path d="M70 70 L120 18 H280 L330 70 Z" fill="#2a78e8"/>
    <rect x="130" y="28" width="140" height="36" rx="8" fill="#0b1e33" opacity="0.85"/>
    <rect x="40" y="88" width="70" height="18" rx="6" fill="url(#accent)"/>
    <rect x="290" y="88" width="70" height="18" rx="6" fill="url(#accent)"/>
    <!-- wheels -->
    <circle cx="90" cy="165" r="34" fill="#0d1520" stroke="#eef5ff" stroke-width="6"/>
    <circle cx="90" cy="165" r="12" fill="#5b9fff"/>
    <circle cx="310" cy="165" r="34" fill="#0d1520" stroke="#eef5ff" stroke-width="6"/>
    <circle cx="310" cy="165" r="12" fill="#5b9fff"/>
    <!-- antenna -->
    <path d="M300 18 L310 -20" stroke="#eef5ff" stroke-width="3"/>
    <circle cx="310" cy="-24" r="7" fill="#ffb020"/>
  </g>
  <!-- circuit lines -->
  <g stroke="#5b9fff" stroke-opacity="0.25" stroke-width="1.5">
    <path d="M80 160 H220 L260 200 H380"/>
    <path d="M1080 140 H1220 L1260 180"/>
    <circle cx="220" cy="160" r="3" fill="#ffb020" stroke="none"/>
    <circle cx="1220" cy="140" r="3" fill="#ffb020" stroke="none"/>
  </g>
</svg>
